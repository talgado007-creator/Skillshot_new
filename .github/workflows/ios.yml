# Builds the iOS app on GitHub's macOS runners — this is how you ship to the
# App Store without owning a Mac.
#
# macos-26 ships Xcode 26.x, which satisfies Apple's requirement that App Store
# uploads be built with Xcode 26+ against the iOS 26 SDK.
#
# COST NOTE: macOS runner minutes bill at 10x the Linux rate on PRIVATE repos.
# While this repo is public they are free.
#
# ── SIGNING IS MANUAL, ON PURPOSE ──────────────────────────────────────────────
# Automatic signing cannot work on a Mac-less account, and three runs proved it.
# `xcodebuild archive` with CODE_SIGN_STYLE=Automatic always asks Apple for a
# DEVELOPMENT profile; development profiles embed device UDIDs; and Apple refuses
# to issue one to a team with no registered devices — which a CI-only account
# never has ("Your team has no devices from which to generate a provisioning
# profile"). Deleting Capacitor's hardcoded "iPhone Developer" identity from the
# Release config did not help, and forcing CODE_SIGN_IDENTITY=Apple Distribution
# is rejected outright ("conflicting provisioning settings") because automatic
# signing owns that decision. Manual signing sidesteps all of it: a human mints
# the certificate and profile once, they live as secrets, and the build never
# needs to talk to Apple's provisioning service at all.
#
# Secrets required for a signed build:
#   IOS_P12_BASE64      base64 of the Apple Distribution certificate + private key
#   IOS_P12_PASSWORD    password protecting that .p12
#   IOS_PROFILE_BASE64  base64 of the App Store .mobileprovision
#   IOS_TEAM_ID         10-character Team ID
# Only needed to actually send the build to TestFlight:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY
#
# With IOS_P12_BASE64 unset this still builds UNSIGNED, which proves it compiles.
#
# The distribution certificate expires one year after issue. When it does, builds
# fail with "no identity found" — regenerate it and replace IOS_P12_BASE64.
name: iOS

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Also upload to TestFlight (needs the ASC_* secrets)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    env:
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install and sync
        run: |
          npm ci
          npx cap sync ios

      # No CocoaPods here. Capacitor 8 wires its plugins through Swift Package
      # Manager (ios/App/CapApp-SPM), so there is no Podfile and no .xcworkspace —
      # every xcodebuild call uses -project App.xcodeproj on purpose.
      - name: Show what Xcode sees
        working-directory: ios/App
        run: xcodebuild -project App.xcodeproj -list

      # ── unsigned path: no certificate secret set ────────────────────────────
      - name: Build (unsigned)
        if: env.IOS_P12_BASE64 == ''
        working-directory: ios/App
        run: |
          echo "No IOS_P12_BASE64 secret - building UNSIGNED. This cannot be uploaded."
          ARGS=(-project App.xcodeproj -scheme App -configuration Release)
          ARGS+=(-destination 'generic/platform=iOS')
          ARGS+=(CODE_SIGNING_ALLOWED=NO)
          xcodebuild "${ARGS[@]}" clean build

      # ── signed path ─────────────────────────────────────────────────────────
      # Every xcodebuild call below builds its arguments in a bash array rather
      # than using backslash line continuations. Same result, but nothing breaks
      # if a line gets reflowed.
      - name: Import certificate and profile
        if: env.IOS_P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/skillshot.keychain-db"
          KPW=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "::add-mask::$KPW"

          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          # codesign only searches keychains that are on the user search list
          ORIG=$(security list-keychains -d user | tr -d '"' | tr -d ' ')
          security list-keychains -d user -s "$KEYCHAIN" $ORIG
          security default-keychain -s "$KEYCHAIN"

          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$IOS_P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          # Without set-key-partition-list, codesign raises a GUI keychain prompt
          # that nobody can answer and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

          echo "signing identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/pp.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/pp.mobileprovision" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$RUNNER_TEMP/pp.mobileprovision" | plutil -extract Name raw -)
          APPID=$(security cms -D -i "$RUNNER_TEMP/pp.mobileprovision" | plutil -extract Entitlements.application-identifier raw -)
          cp "$RUNNER_TEMP/pp.mobileprovision" "$PROFILES/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "installed profile: $NAME  uuid=$UUID  app-id=$APPID"

      - name: Archive (signed)
        if: env.IOS_P12_BASE64 != ''
        working-directory: ios/App
        run: |
          set -euo pipefail
          # CURRENT_PROJECT_VERSION is the build number. App Store Connect refuses a
          # second upload with a build number it has already seen, so tie it to the
          # run number — it never repeats and always climbs.
          ARGS=(-project App.xcodeproj -scheme App -configuration Release)
          ARGS+=(-destination 'generic/platform=iOS')
          ARGS+=(-archivePath "$RUNNER_TEMP/App.xcarchive")
          ARGS+=(CODE_SIGN_STYLE=Manual)
          ARGS+=(CODE_SIGN_IDENTITY="Apple Distribution")
          ARGS+=(PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID")
          ARGS+=(DEVELOPMENT_TEAM="$IOS_TEAM_ID")
          ARGS+=(OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN")
          ARGS+=(CURRENT_PROJECT_VERSION=${{ github.run_number }})
          xcodebuild "${ARGS[@]}" clean archive

      - name: Export .ipa
        if: env.IOS_P12_BASE64 != ''
        working-directory: ios/App
        run: |
          set -euo pipefail
          PLIST_PATH="$RUNNER_TEMP/ExportOptions.plist"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>method</key><string>app-store-connect</string>'
            echo "  <key>teamID</key><string>$IOS_TEAM_ID</string>"
            echo '  <key>signingStyle</key><string>manual</string>'
            echo '  <key>signingCertificate</key><string>Apple Distribution</string>'
            echo '  <key>provisioningProfiles</key>'
            echo '  <dict>'
            echo "    <key>skillshot.dodge.app</key><string>$PROFILE_UUID</string>"
            echo '  </dict>'
            echo '  <key>uploadSymbols</key><true/>'
            echo '  <key>destination</key><string>export</string>'
            echo '</dict>'
            echo '</plist>'
          } > "$PLIST_PATH"
          plutil -lint "$PLIST_PATH"

          ARGS=(-exportArchive)
          ARGS+=(-archivePath "$RUNNER_TEMP/App.xcarchive")
          ARGS+=(-exportOptionsPlist "$PLIST_PATH")
          ARGS+=(-exportPath "$RUNNER_TEMP/export")
          xcodebuild "${ARGS[@]}"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload build artifact
        if: env.IOS_P12_BASE64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: skillshot-ios
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: env.IOS_P12_BASE64 != '' && env.ASC_KEY_ID != '' && inputs.upload
        run: |
          set -euo pipefail
          # altool looks for AuthKey_<id>.p8 in ~/.appstoreconnect/private_keys and
          # ~/private_keys, so the key goes in both and no path is passed.
          mkdir -p ~/.appstoreconnect/private_keys ~/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/private_keys/
          chmod 600 ~/.appstoreconnect/private_keys/*.p8 ~/private_keys/*.p8
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "Uploading $IPA"
          # altool(1) spells these --apiKey / --apiIssuer, camelCase, not hyphenated.
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up secrets from the runner
        if: always()
        run: |
          rm -rf ~/.appstoreconnect/private_keys ~/private_keys
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" || true
          fi
