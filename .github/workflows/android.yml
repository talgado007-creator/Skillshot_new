name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      # Read by android/app/build.gradle. Play refuses a version code it has seen
      # before, so it tracks the run number rather than a hardcoded value.
      SKILLSHOT_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install and sync
        run: |
          npm ci
          npx cap sync android

      # Windows does not carry the executable flag across, so Linux refuses to run
      # gradlew without this.
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Build release bundle
        working-directory: android
        env:
          SKILLSHOT_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SKILLSHOT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SKILLSHOT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/keystore.jks ]; then
            export SKILLSHOT_STORE_FILE=keystore.jks
            echo "Signing with keystore."
          else
            echo "No keystore secret set - building UNSIGNED. Play will not accept this."
          fi
          echo "Version code: ${SKILLSHOT_VERSION_CODE:-1 (fallback - env var did not reach the build)}"
          ./gradlew bundleRelease --no-daemon

      - name: Build debug APK for sideloading
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: skillshot-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
